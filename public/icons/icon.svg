<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Pure White Background -->
  <rect width="512" height="512" fill="#ffffff"/>

  <!-- Centered Document Icon (Smaller with comfortable padding) -->
  <g id="document">
    <!-- Subtle drop shadow for document -->
    <rect x="150" y="112" width="212" height="288" rx="20" fill="#e2e8f0"/>

    <!-- Main document page -->
    <!-- Path with top-right corner fold: 
         Starts at (150, 108), width 212, height 288.
         Top edge goes to 312, then folds to (362, 158), down to (362, 396), left to (150, 396), up to (150, 108) -->
    <path d="M 166 108 
             L 312 108 
             L 362 158 
             L 362 380 
             A 16 16 0 0 1 346 396 
             L 166 396 
             A 16 16 0 0 1 150 380 
             L 150 124 
             A 16 16 0 0 1 166 108 Z" 
          fill="#f8fafc" 
          stroke="#334155" 
          stroke-width="12" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>

    <!-- Folded corner flap -->
    <path d="M 312 108 
             L 312 146 
             A 12 12 0 0 0 324 158 
             L 362 158 Z" 
          fill="#cbd5e1" 
          stroke="#334155" 
          stroke-width="12" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>

    <!-- Text / Code lines -->
    <!-- Accent line 1 -->
    <line x1="184" y1="172" x2="250" y2="172" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
    <!-- Line 2 -->
    <line x1="184" y1="212" x2="328" y2="212" stroke="#64748b" stroke-width="10" stroke-linecap="round"/>
    <!-- Line 3 -->
    <line x1="184" y1="248" x2="300" y2="248" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>
    <!-- Line 4 -->
    <line x1="184" y1="284" x2="328" y2="284" stroke="#64748b" stroke-width="10" stroke-linecap="round"/>
    <!-- Line 5 -->
    <line x1="184" y1="320" x2="270" y2="320" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>

    <!-- ++ badge in bottom-right -->
    <g stroke="#2563eb" stroke-width="10" stroke-linecap="round">
      <!-- First + -->
      <line x1="284" y1="358" x2="304" y2="358"/>
      <line x1="294" y1="348" x2="294" y2="368"/>
      <!-- Second + -->
      <line x1="316" y1="358" x2="336" y2="358"/>
      <line x1="326" y1="348" x2="326" y2="368"/>
    </g>
  </g>
</svg>
